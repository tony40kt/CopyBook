workflows:
  ios-capacitor-release:
    name: iOS Capacitor Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
  vars:
    APP_STORE_CONNECT_PRIVATE_KEY: ${-----BEGIN PRIVATE KEY-----
                                    MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgmLzDbfrAS+szNsRd
                                    t+y6js/cAVv+h9m0LSsMMECGqo2gCgYIKoZIzj0DAQehRANCAAQSzVvdadgfEcUl
                                    rRkz+MYH2v6082liHw+ltYadptrjf8ZXWR41nlNb2iBgwJBGe1M7gGu5A3cqpJWo
                                    FGXC5ONi
                                    -----END PRIVATE KEY-----}
    APP_STORE_CONNECT_KEY_IDENTIFIER: ${5T2L6U7S6M}
    APP_STORE_CONNECT_ISSUER_ID: ${32fa399f-840c-4ffc-a409-11eb93653bf5}
      node: 20
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tony40kt.copybook

      groups:
        - app_store_credentials # 你在 Codemagic UI 建這個 group，放 API key

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build

      - name: Ensure iOS platform exists
        script: |
          npx cap add ios || true

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false