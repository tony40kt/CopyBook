workflows:
  ios-capacitor-release:
    name: iOS Capacitor Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 20
      xcode: latest
      cocoapods: default
      
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tony40kt.copybook

      groups:
        - app_store_credentials 

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build

      - name: Ensure iOS platform exists
        script: |
          npx cap add ios || true

      - name: Raise iOS deployment target
        script: |
          sed -i '' "s/platform :ios, '11.0'/platform :ios, '13.0'/g" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/g" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '13.0'/g" ios/App/Podfile || true
          cat ios/App/Podfile

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          # 修正：Capacitor 的證書模式在 CLI 中建议加上 --mode release
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --mode release

    artifacts:
      # 修正：Codemagic 預設的 IPA 產出路徑是在原 Xcode 專案目錄下，而非根目錄的 build/
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
