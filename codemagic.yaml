    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build

      # 修正：1. 明確確保安裝了 @capacitor/ios 套件
      #      2. 移除 || true，如果加失敗就讓它在這裡報錯，我們才能看清原因
      - name: Ensure iOS platform exists
        script: |
          # 檢查本地是否有 ios 資料夾，如果沒有就安裝套件並新增平台
          if [ ! -d "ios" ]; then
            echo "iOS platform folder not found. Installing @capacitor/ios and adding platform..."
            npm install @capacitor/ios
            npx cap add ios
          else
            echo "iOS platform folder already exists."
          fi

      # 修正：現在平台百分之百存在了，進行同步才不會報錯
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing (API-driven)
        script: |
          app-store-connect fetch-signing-files "$bundle_identifier" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --mode release
