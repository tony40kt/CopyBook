workflows:
  ios-capacitor-release:
    name: iOS Capacitor Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 20
      xcode: latest
      cocoapods: default
      
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tony40kt.copybook

      groups:
        - app_store_credentials 

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Build web assets
        script: |
          npm run build

      - name: Ensure iOS platform exists
        script: |
          npx cap add ios || true

      - name: Raise iOS deployment target
        script: |
          # 1. 提升 Podfile 的最低支援版本到 15.0
          sed -i '' "s/platform :ios, '11.0'/platform :ios, '15.0'/g" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '15.0'/g" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/g" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '14.0'/platform :ios, '15.0'/g" ios/App/Podfile || true
          
          # 2. 強制修改主項目 (.xcodeproj) 內的 IPHONEOS_DEPLOYMENT_TARGET 
          # 使用 perl 全局替換專案檔中的 14.0 支援版本為 15.0
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          perl -pi -e 's/IPHONEOS_DEPLOYMENT_TARGET = 11.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj

          # 檢查 Podfile 確保修改成功
          cat ios/App/Podfile

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          # 已修正：將不支援的 --mode release 改為 --config Release
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release


    artifacts:
      # 真正正確的 Codemagic 預設產出路徑（根目錄）
      - build/ios/ipa/*.ipa
      - /tmp/xcodebook_logs/*.log  # 或者保留 /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
